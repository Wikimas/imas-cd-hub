<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}765PRO Hub{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <div class="brand"><a href="/" style="color:inherit;text-decoration:none">765PRO Hub</a></div>
    <nav>
      <a href="/" class="{% if nav == 'home' %}active{% endif %}">品牌总览</a>
      <a href="/queue" class="{% if nav == 'queue' %}active{% endif %}">审核队列</a>
      <form class="search-form" action="/search" method="get" role="search">
        <input class="field-input" type="search" name="q" placeholder="搜索专辑 / 曲目 / 品番 / 艺人"
               value="{{ q if q is defined else '' }}" />
      </form>
    </nav>
    <div class="meta">v{{ version }}</div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>765PRO Hub · 偶像大师 CD 元数据目录</footer>
</body>
</html>
