{% extends "base.html" %}
{% set nav = "home" %}
{% block title %}新建专辑 · IMAS CD Hub{% endblock %}
{% block content %}
<p>
  <a href="/">品牌</a>
  {% if series.shelf_code %}
  · <a href="/shelf/{{ series.shelf_code }}">{{ series.shelf_title or series.shelf_code }}</a>
  {% endif %}
  · <a href="/series/{{ series.code }}">{{ series.title or series.code }}</a>
</p>
<div class="page-title-row">
  <h1>新建专辑</h1>
  <span class="badge manual">{{ series.code }}</span>
</div>

<div class="panel" id="release-form-panel" style="margin-bottom:1rem;max-width:44rem"
     data-series-code="{{ series.code }}">
  <div class="edit-grid" style="margin-top:0.75rem">
    <div class="span-2">
      <label class="field-label" for="nf-title">标题 *</label>
      <input class="field-input" id="nf-title" type="text" placeholder="专辑标题" />
    </div>
    <div>
      <label class="field-label" for="nf-catalog">品番</label>
      <input class="field-input mono" id="nf-catalog" type="text" placeholder="可空，有则唯一" />
    </div>
    <div>
      <label class="field-label" for="nf-date">发售日</label>
      <input class="field-input mono" id="nf-date" type="text" placeholder="YYYY-MM-DD" />
    </div>
    <div>
      <label class="field-label" for="nf-tracks">初始曲目数</label>
      <input class="field-input mono" id="nf-tracks" type="number" min="0" max="99" value="0" />
    </div>
    <div>
      <label class="field-label" for="nf-status">审核状态</label>
      <select class="field-input" id="nf-status">
        <option value="needs_fill" selected>需人工填充</option>
        <option value="unreviewed">未人工审核</option>
        <option value="reviewed">审核完</option>
      </select>
    </div>
  </div>
  <div style="margin-top:0.75rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
    <button type="button" class="btn btn-primary" id="btn-create-release">创建专辑</button>
    <span class="path" id="form-status"></span>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
(function () {
  const seriesCode = document.getElementById("release-form-panel").dataset.seriesCode;
  const toastEl = document.getElementById("toast");
  function toast(msg, kind) {
    toastEl.textContent = msg;
    toastEl.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toastEl._t);
    toastEl._t = setTimeout(function () { toastEl.classList.remove("show"); }, 3200);
  }
  document.getElementById("btn-create-release").addEventListener("click", async function () {
    const title = (document.getElementById("nf-title").value || "").trim();
    if (!title) {
      toast("请填写标题", "bad");
      return;
    }
    const body = {
      title: title,
      catalog_no: document.getElementById("nf-catalog").value || null,
      date_guess: document.getElementById("nf-date").value || null,
      track_count: parseInt(document.getElementById("nf-tracks").value || "0", 10) || 0,
      review_status: document.getElementById("nf-status").value || "needs_fill",
    };
    const st = document.getElementById("form-status");
    st.innerHTML = '<span class="badge pending">创建中…</span>';
    try {
      const res = await fetch("/api/series/" + encodeURIComponent(seriesCode) + "/releases", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(function () { return {}; });
      if (!res.ok) {
        const detail = data.detail;
        let msg = "HTTP " + res.status;
        if (typeof detail === "string") msg = detail;
        else if (Array.isArray(detail)) msg = detail.map(function (d) { return d.msg || JSON.stringify(d); }).join("; ");
        else if (data.message) msg = data.message;
        throw new Error(msg);
      }
      st.innerHTML = '<span class="badge ok">已创建</span>';
      toast("已创建专辑 #" + data.release_id, "ok");
      setTimeout(function () {
        location.href = data.url || ("/release/" + data.release_id);
      }, 400);
    } catch (err) {
      st.innerHTML = '<span class="badge bad">失败</span>';
      toast(err.message || String(err), "bad");
    }
  });
})();
</script>
{% endblock %}
